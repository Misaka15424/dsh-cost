name: CI and npm publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Host half depends on @deepseek-ai/schemastery and zod, so the test
      # suite needs an install first (the upstream repo had no dependencies).
      - run: npm ci
      - run: npm test

  publish:
    # Manual only. The `dsh-cost-log` name on npm is owned by another publisher,
    # so this repository cannot publish it; publishing on tag push could only ever
    # fail. Restore the tag trigger if this fork ever publishes under a name it owns.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check if version already published
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-cost-log@${VERSION}" version --silent >/dev/null 2>&1; then
            echo "Version ${VERSION} already exists on npm, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
